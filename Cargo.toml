[package]
name = "solid-barnacle"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[[bin]]
name = "client"
path = "src/client.rs"

[dependencies]
axum = { version = "0.8.9", features= ["ws"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
futures-util = "0.3.34"
headers = "0.4.2"
tokio = { version = "1.53.3", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect"] }
tower-http = "0.7.1"
tracing-subscriber = "0.3.23"

